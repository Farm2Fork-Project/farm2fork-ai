[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farm2fork-ai"
version = "0.1.0"
description = "AI-powered crop quality grading pipeline for Farm2Fork."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10.0.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
ml = [
  "albumentations>=1.3.1",
  "numpy>=1.26.0",
  "open-clip-torch>=2.24.0",
  "pandas>=2.1.0",
  "scikit-learn>=1.3.0",
  "timm>=0.9.12",
  "torch>=2.2.0",
  "torchvision>=0.17.0",
]
api = [
  "fastapi>=0.111.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29.0",
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
